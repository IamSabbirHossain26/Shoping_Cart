<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">🛍 SABBIR26</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Contact</a></li>
                <li class="cart-icon" onclick="toggleCart()">
                    🛍️ Cart (<span id="cart-count">0</span>)
                </li>
            </ul>
        </nav>
    </header>
    <section id="products-container"></section>

    <section id="cart-container" class="hidden">
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <p>Total: $<span id="total-price">0.00</span></p>
        <button id="clear-cart">Clear Cart</button>
        <button id="checkout">Checkout</button>
    </section>
    
    <div class="main-content">
        <!-- All page content goes here -->
    </div>
    <footer>
        <div class="logo">🛍 SABBIR26</div>
        <p>© 2024 Md Sabbir Hossain. All rights reserved.</p>
    </footer>
    <script src="products.js"></script>
    <script src="cart.js"></script>
    <script src="ui.js"></script>
</body>
</html>
